project:
  type: website
  output-dir: _site
  resources:
    - styles.css
  render:
    - index.qmd
    - docs/course-outline.qmd
    - docs/general-info.qmd
    - docs/module-01-overview.qmd
    - docs/module-02-overview.qmd
    - docs/module-03-overview.qmd
    - docs/glossary.qmd
    - docs/for-collaborators.qmd
    - docs/ai-policy.qmd
    - docs/mfb-alignment.qmd
    - docs/impuls-proposal-brief.qmd
    - docs/week-01-dept-map-brief.qmd
    # Live hub: only published weeks (Modul 1 through Checkpoint A).
    # Later week sources stay in git; add paths here when releasing.
    - weeks/week-01/*.qmd
    - weeks/week-02/*.qmd
    - weeks/week-03/*.qmd
    - weeks/week-04/*.qmd

lang: de

