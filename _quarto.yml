project:
  type: website
  output-dir: _site
  resources:
    - styles.css
    - docs/kursinfo.pdf
    - docs/kursplan.pdf
  render:
    - index.qmd
    - docs/module-01-overview.qmd
    - docs/module-02-overview.qmd
    - docs/module-03-overview.qmd
    - docs/glossary.qmd
    - docs/for-collaborators.qmd
    - docs/ai-policy.qmd
    # Live hub: only published weeks (Modul 1 through Checkpoint A).
    # Later week sources stay in git; add paths here when releasing.
    # Week 1 has slides only (no student notebook).
    - weeks/week-01/slides.qmd
    - weeks/week-01/glossary.qmd
    - weeks/week-02/*.qmd
    - weeks/week-03/*.qmd
    - weeks/week-04/*.qmd

lang: de

website:
  title: "Quantitative Biologie I"
  navbar:
    left:
      - href: index.qmd
        text: Start
      - href: docs/glossary.qmd
        text: Glossar
      - href: docs/ai-policy.qmd
        text: KI-Richtlinie
      - text: Folien
        menu:
          - href: weeks/week-01/slides.qmd
            text: "Woche 1"
          - href: weeks/week-02/slides.qmd
            text: "Woche 2"
          - href: weeks/week-03/slides.qmd
            text: "Woche 3"
          - href: weeks/week-04/slides.qmd
            text: "Woche 4"
      - text: Notebooks
        menu:
          - href: weeks/week-02/notebook.qmd
            text: "Woche 2"
          - href: weeks/week-03/notebook.qmd
            text: "Woche 3"
          - href: weeks/week-04/notebook.qmd
            text: "Woche 4"

# Do NOT set project-level format: html here.
# That overrides slide decks. HTML pages declare format in their own YAML;
# slides declare format: revealjs in theirs.

execute:
  freeze: auto
  warning: false
  message: false
