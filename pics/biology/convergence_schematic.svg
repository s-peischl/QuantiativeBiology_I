<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
  <rect width="980" height="480" fill="white"/>
  <text x="490" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">Konvergente Evolution</text>
  <text x="490" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Ähnliches Ergebnis unabhängig — nicht durch Übernahme derselben DNA</text>

  <circle cx="490" cy="120" r="36" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Vorfahr</text>
  <line x1="490" y1="156" x2="490" y2="190" stroke="#2c3e50" stroke-width="3"/>
  <line x1="250" y1="190" x2="730" y2="190" stroke="#2c3e50" stroke-width="3"/>
  <line x1="250" y1="190" x2="250" y2="230" stroke="#2c3e50" stroke-width="3"/>
  <line x1="730" y1="190" x2="730" y2="230" stroke="#2c3e50" stroke-width="3"/>

  <!-- lineage A -->
  <rect x="140" y="230" width="220" height="70" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="250" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">Linie A</text>
  <text x="250" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">(z. B. Population 1)</text>

  <!-- lineage B -->
  <rect x="620" y="230" width="220" height="70" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#196f3d">Linie B</text>
  <text x="730" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">(z. B. Population 2)</text>

  <!-- independent mutations -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <line x1="250" y1="300" x2="250" y2="340" stroke="#c0392b" stroke-width="3" marker-end="url(#a1)"/>
  <line x1="730" y1="300" x2="730" y2="340" stroke="#c0392b" stroke-width="3" marker-end="url(#a1)"/>
  <text x="250" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">eigene Mutation</text>
  <text x="730" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">eigene Mutation</text>

  <!-- similar outcome -->
  <rect x="140" y="380" width="220" height="50" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="250" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7e5109">ähnliches Merkmal</text>
  <rect x="620" y="380" width="220" height="50" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
  <text x="730" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7e5109">ähnliches Merkmal</text>

  <text x="490" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#7f8c8d">≠</text>
  <text x="490" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f8c8d">kein DNA-Transfer</text>

  <text x="490" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lehrschema: aehnlich aussehen ≠ dieselbe Geschichte im Genom.</text>
</svg>
