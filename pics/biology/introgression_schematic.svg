<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
  <rect width="980" height="480" fill="white"/>
  <text x="490" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">Was ist Introgression?</text>
  <text x="490" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">DNA-Abschnitte wandern durch Mischung in eine andere Population / Linie</text>

  <text x="120" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">Vergangenheit</text>
  <circle cx="120" cy="140" r="28" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Vorfahr</text>

  <line x1="120" y1="168" x2="120" y2="200" stroke="#2c3e50" stroke-width="3"/>
  <line x1="120" y1="200" x2="280" y2="200" stroke="#2c3e50" stroke-width="3"/>
  <line x1="120" y1="200" x2="120" y2="230" stroke="#2c3e50" stroke-width="3"/>
  <line x1="280" y1="200" x2="280" y2="230" stroke="#2c3e50" stroke-width="3"/>

  <rect x="40" y="230" width="160" height="70" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="120" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">moderne</text>
  <text x="120" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">Menschen</text>

  <rect x="200" y="230" width="160" height="70" rx="10" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="280" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6c3483">Denisova</text>
  <text x="280" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6c3483">(archaisch)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <path d="M250 300 Q 320 340 380 360" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="300" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">Mischung</text>
  <text x="300" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b">(Admixture)</text>

  <rect x="400" y="330" width="240" height="90" rx="12" fill="#fdebd0" stroke="#d68910" stroke-width="3"/>
  <text x="520" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e5109">heutige Population</text>
  <text x="520" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">meist moderne DNA</text>
  <text x="520" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8e44ad">+ einzelne archaische Stücke</text>

  <rect x="680" y="120" width="260" height="200" rx="12" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="2"/>
  <text x="810" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">Introgression</text>
  <text x="810" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">= Genaustausch nach</text>
  <text x="810" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">früherer Trennung</text>
  <text x="810" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Nicht die ganze DNA -</text>
  <text x="810" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">oft nur kurze Haplotypen</text>
  <text x="810" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">(z. B. um EPAS1)</text>

  <text x="490" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lehrschema. Neandertaler/Denisova-Mischung mit modernen Menschen ist gut belegt.</text>
</svg>
