<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="white"/>
  <text x="500" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">Was ist Introgression?</text>
  <text x="500" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Kurze Ber&#252;hrung &#8594; DNA-St&#252;cke wandern &#8594; Menschen gehen weiter, Denisova stirbt aus</text>

  <!-- time axis -->
  <line x1="55" y1="85" x2="55" y2="490" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="55,502 49,488 61,488" fill="#7f8c8d"/>
  <text x="28" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" transform="rotate(-90 28,140)">Vergangenheit</text>
  <text x="28" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" transform="rotate(-90 28,430)">Heute</text>

  <!-- ancestor -->
  <circle cx="300" cy="95" r="26" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Vorfahr</text>

  <!-- split -->
  <line x1="300" y1="121" x2="300" y2="150" stroke="#2c3e50" stroke-width="3"/>
  <line x1="180" y1="150" x2="420" y2="150" stroke="#2c3e50" stroke-width="3"/>

  <!-- human lineage (continues all the way) -->
  <line x1="180" y1="150" x2="180" y2="420" stroke="#2980b9" stroke-width="5"/>
  <text x="125" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">moderne</text>
  <text x="125" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Menschen</text>
  <text x="115" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a5276">laufen</text>
  <text x="115" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a5276">weiter</text>

  <!-- Denisova lineage (ends after contact) -->
  <line x1="420" y1="150" x2="420" y2="310" stroke="#8e44ad" stroke-width="5"/>
  <text x="475" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Denisova</text>
  <text x="475" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">(archaisch)</text>

  <!-- brief contact band -->
  <rect x="150" y="245" width="300" height="58" rx="10" fill="#fdebd0" stroke="#d68910" stroke-width="2.5"/>
  <text x="300" y="267" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e5109">kurze Ber&#252;hrung</text>
  <text x="300" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7e5109">Mischung / Admixture (nur begrenzte Zeit)</text>

  <!-- DNA transfer arrow during contact -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="395" y1="274" x2="215" y2="274" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="300" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">DNA-Transfer &#8592;</text>

  <!-- extinction marker -->
  <line x1="400" y1="300" x2="440" y2="340" stroke="#c0392b" stroke-width="4"/>
  <line x1="440" y1="300" x2="400" y2="340" stroke="#c0392b" stroke-width="4"/>
  <text x="470" y="318" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">Denisova</text>
  <text x="470" y="338" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">stirbt aus</text>

  <!-- today -->
  <rect x="70" y="420" width="220" height="78" rx="12" fill="#d6eaf8" stroke="#2980b9" stroke-width="3"/>
  <text x="180" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">heutige Population</text>
  <text x="180" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">meist moderne DNA</text>
  <text x="180" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8e44ad">+ einzelne archaische St&#252;cke</text>

  <!-- definition panel -->
  <rect x="640" y="95" width="320" height="270" rx="12" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="2"/>
  <text x="800" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">Introgression</text>
  <text x="800" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">= Genaustausch nach</text>
  <text x="800" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">fr&#252;herer Trennung</text>

  <text x="800" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7e5109">1. kurze Ber&#252;hrung</text>
  <text x="800" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a5276">2. Menschen weiter</text>
  <text x="800" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b">3. Denisova aus</text>

  <text x="800" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">Nicht die ganze DNA &#8212;</text>
  <text x="800" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">oft nur kurze Haplotypen</text>
  <text x="800" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">(z. B. um EPAS1)</text>

  <text x="500" y="535" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Lehrschema. Die Ber&#252;hrung war zeitlich begrenzt; archaische Linien endeten, Spuren bleiben in heutigen Genomen.</text>
</svg>
