<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <rect width="860" height="520" fill="white"/>
  <text x="430" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">Milzgrösse: zwei Vergleiche</text>
  <text x="430" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Lehrschema nach Ilardo et al. 2018 (Cell) — Verhältnisse vereinfacht</text>

  <line x1="80" y1="400" x2="800" y2="400" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="90" stroke="#222" stroke-width="2"/>
  <text x="35" y="260" text-anchor="middle" transform="rotate(-90 35 260)" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">Relative Milzgrösse</text>

  <line x1="75" y1="400" x2="85" y2="400" stroke="#222"/>
  <text x="68" y="405" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12">0</text>
  <line x1="75" y1="280" x2="85" y2="280" stroke="#222"/>
  <text x="68" y="285" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12">1.0</text>
  <line x1="75" y1="160" x2="85" y2="160" stroke="#222"/>
  <text x="68" y="165" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12">1.5</text>
  <line x1="80" y1="280" x2="800" y2="280" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- Saluan -->
  <rect x="140" y="280" width="110" height="120" fill="#7f8c8d" stroke="#222"/>
  <text x="195" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">1.0x</text>
  <text x="195" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Saluan</text>
  <text x="195" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">Nachbarpopulation</text>
  <text x="195" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">(nicht tauchend)</text>

  <!-- non-diving Bajau -->
  <rect x="360" y="190" width="110" height="210" fill="#5dade2" stroke="#222"/>
  <text x="415" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">~1.5x</text>
  <text x="415" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Bajau</text>
  <text x="415" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">nicht tauchend</text>
  <text x="415" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">(gleiche Population)</text>

  <!-- diving Bajau -->
  <rect x="580" y="190" width="110" height="210" fill="#1a5276" stroke="#222"/>
  <text x="635" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">~1.5x</text>
  <text x="635" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Bajau</text>
  <text x="635" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">tauchend</text>
  <text x="635" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">(gleiche Population)</text>

  <!-- arrows / labels -->
  <path d="M250 250 H350" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="300" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">Vergleich 1</text>
  <text x="300" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b">Nachbarpopulation</text>

  <path d="M470 150 H580" stroke="#196f3d" stroke-width="2" fill="none"/>
  <text x="525" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#196f3d">Vergleich 2</text>
  <text x="525" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">innerhalb Bajau</text>

  <text x="430" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Lehrschema. Originaldaten/Boxplots: Ilardo et al. 2018 Cell — dort nachschlagen.</text>
</svg>
