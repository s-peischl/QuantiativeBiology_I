<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <rect width="960" height="320" fill="white"/>
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#7e5109">alpha mechanistisch: wie viel Platz kostet die andere Art?</text>

  <!-- left: K alone -->
  <rect x="24" y="55" width="280" height="240" rx="14" fill="#eaf2fb" stroke="#2980b9" stroke-width="3"/>
  <text x="164" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Allein · Deckel K1</text>
  <rect x="54" y="110" width="200" height="28" rx="4" fill="#f5b041" stroke="#b7950b"/>
  <text x="154" y="129" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7e5109">gemeinsames Futter</text>
  <!-- blue cells filling capacity -->
  <ellipse cx="80" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="120" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="160" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="200" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="100" cy="210" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="140" cy="210" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="180" cy="210" rx="16" ry="9" fill="#85c1e9" stroke="#1a5276" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="164" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">1 Individuum Art 1</text>
  <text x="164" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">= 1 Platz in K1</text>

  <!-- right: with competitor -->
  <rect x="340" y="55" width="596" height="240" rx="14" fill="#fef5e7" stroke="#d68910" stroke-width="3"/>
  <text x="638" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7e5109">Zusammen · alpha12</text>
  <rect x="380" y="110" width="200" height="28" rx="4" fill="#f5b041" stroke="#b7950b"/>
  <text x="480" y="129" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7e5109">dieselbe Ressource</text>
  <ellipse cx="410" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="450" cy="180" rx="16" ry="9" fill="#5dade2" stroke="#1a5276" stroke-width="1.5"/>
  <!-- green takes more slots if alpha > 1 -->
  <ellipse cx="520" cy="175" rx="22" ry="12" fill="#27ae60" stroke="#1a5276" stroke-width="2"/>
  <text x="520" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Art 2</text>
  <path d="M520 195 L500 230 M520 195 L540 230" stroke="#c0392b" stroke-width="2"/>
  <text x="520" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#922b21">kostet alpha12 Plaetze</text>
  <text x="520" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">fuer Art 1 (alpha12 &gt; 1: stark)</text>

  <rect x="640" y="140" width="270" height="110" rx="10" fill="white" stroke="#7e5109" stroke-width="2"/>
  <text x="775" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Effektiver Verbrauch</text>
  <text x="775" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7e5109">N1 + alpha12 · N2</text>
  <text x="775" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">gegenueber K1</text>
</svg>
