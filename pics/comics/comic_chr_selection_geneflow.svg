<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
  <rect width="940" height="360" fill="#fbfcfd"/>
  <text x="470" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">Entlang des Chromosoms: Selektion vs. Genfluss</text>

  <!-- axes -->
  <line x1="80" y1="280" x2="880" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <text x="40" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 40 170)">|p1 − p2| bzw. FST</text>
  <text x="480" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">Position entlang des Chromosoms</text>

  <!-- background low line -->
  <path d="M80,250 C150,245 220,255 300,248 C380,242 450,252 520,248 C600,245 700,252 880,250" fill="none" stroke="#7f8c8d" stroke-width="2.5"/>
  <text x="200" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f8c8d">Hintergrund: Genfluss + Rekombination homogenisieren</text>

  <!-- peaks -->
  <path d="M280,248 L300,90 L320,248" fill="none" stroke="#b2182b" stroke-width="3"/>
  <path d="M520,248 L540,100 L560,248" fill="none" stroke="#b2182b" stroke-width="3"/>
  <circle cx="300" cy="90" r="7" fill="#b2182b"/>
  <circle cx="540" cy="100" r="7" fill="#b2182b"/>
  <text x="300" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b2182b">lokale Selektion</text>
  <text x="540" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b2182b">lokale Selektion</text>

  <rect x="100" y="320" width="18" height="10" fill="#b2182b"/>
  <text x="125" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Differenzierung erhalten</text>
  <rect x="320" y="320" width="18" height="10" fill="#7f8c8d"/>
  <text x="345" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Homogenisierung</text>
