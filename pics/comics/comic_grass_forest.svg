<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <rect width="960" height="380" fill="#fbfcfd"/>
  <text x="480" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a5276">Grasland vs. Wald - zwei stabile Zustaende</text>

  <rect x="40" y="60" width="400" height="280" rx="14" fill="#fef9e7" stroke="#d68910" stroke-width="3"/>
  <text x="240" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#9a7b0a">Grasland</text>
  <!-- grass icons -->
  <g fill="#27ae60">
    <path d="M80,280 Q90,200 100,280"/><path d="M100,280 Q110,190 120,280"/><path d="M120,280 Q130,210 140,280"/>
    <path d="M160,280 Q170,185 180,280"/><path d="M180,280 Q190,200 200,280"/><path d="M200,280 Q210,190 220,280"/>
    <path d="M240,280 Q250,195 260,280"/><path d="M260,280 Q270,185 280,280"/><path d="M280,280 Q290,205 300,280"/>
    <path d="M320,280 Q330,190 340,280"/><path d="M340,280 Q350,200 360,280"/><path d="M360,280 Q370,185 380,280"/>
  </g>
  <line x1="70" y1="285" x2="410" y2="285" stroke="#9a7b0a" stroke-width="2"/>
  <text x="240" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">viel Gras G, wenig Baeume W</text>

  <rect x="520" y="60" width="400" height="280" rx="14" fill="#e8f8f5" stroke="#1e8449" stroke-width="3"/>
  <text x="720" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#145a32">Wald</text>
  <!-- trees -->
  <g>
    <rect x="580" y="220" width="14" height="60" fill="#6e2c00"/><ellipse cx="587" cy="200" rx="34" ry="40" fill="#1e8449"/>
    <rect x="660" y="210" width="16" height="70" fill="#6e2c00"/><ellipse cx="668" cy="185" rx="40" ry="48" fill="#196f3d"/>
    <rect x="750" y="225" width="14" height="55" fill="#6e2c00"/><ellipse cx="757" cy="205" rx="32" ry="38" fill="#27ae60"/>
    <rect x="820" y="215" width="15" height="65" fill="#6e2c00"/><ellipse cx="827" cy="190" rx="36" ry="44" fill="#145a32"/>
  </g>
  <line x1="550" y1="285" x2="900" y2="285" stroke="#1e8449" stroke-width="2"/>
  <text x="720" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">viele Baeume W, Gras unterdrueckt</text>

  <text x="480" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">gleiche Regeln - anderer Start (oder Stoerung) - anderer Endzustand</text>
</svg>
