<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <rect width="960" height="320" fill="white"/>
  <text x="480" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">Hysterese: Hinweg und Rueckweg sind nicht gleich</text>

  <!-- axes -->
  <line x1="80" y1="260" x2="900" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="260" x2="80" y2="50" stroke="#333" stroke-width="2"/>
  <text x="490" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">Umweltparameter (z. B. R)</text>
  <text x="28" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" transform="rotate(-90 28 160)">Zustand</text>

  <!-- low branch -->
  <path d="M 100 230 C 220 225, 320 220, 420 210" fill="none" stroke="#27ae60" stroke-width="4"/>
  <!-- jump up -->
  <path d="M 420 210 L 420 95" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- high branch -->
  <path d="M 420 95 C 520 85, 650 80, 820 75" fill="none" stroke="#c0392b" stroke-width="4"/>
  <!-- return high -->
  <path d="M 820 75 C 650 80, 480 90, 280 100" fill="none" stroke="#d68910" stroke-width="4"/>
  <!-- jump down -->
  <path d="M 280 100 L 280 235" fill="none" stroke="#d68910" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- return low -->
  <path d="M 280 235 C 200 238, 140 240, 100 242" fill="none" stroke="#27ae60" stroke-width="3" opacity="0.5"/>

  <circle cx="420" cy="210" r="6" fill="#27ae60"/>
  <circle cx="280" cy="100" r="6" fill="#d68910"/>

  <text x="440" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">Kippen nach oben</text>
  <text x="150" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a7b0a">Kippen nach unten</text>
  <text x="700" y="55" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#922b21">hoher Zustand</text>
  <text x="180" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">niedriger Zustand</text>

  <text x="480" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Beim Zurueckdrehen muss man oft weiter zurueck als bis zum Ausloesepunkt</text>
</svg>
