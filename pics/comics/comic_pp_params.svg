<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="white"/>
  <text x="500" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222">Jeder Parameter = ein Ereignis</text>

  <!-- r -->
  <rect x="20" y="50" width="230" height="160" rx="12" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="135" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">r</text>
  
  <ellipse cx="100" cy="120" rx="19.599999999999998" ry="11.2" fill="#5dade2" stroke="#1a5276" stroke-width="2"/>
  <circle cx="94.4" cy="118.6" r="2.0999999999999996" fill="#1a5276"/>
  <circle cx="104.2" cy="118.6" r="2.0999999999999996" fill="#1a5276"/>

  
  <ellipse cx="150" cy="130" rx="14.0" ry="8.0" fill="#85c1e9" stroke="#1a5276" stroke-width="2"/>
  <circle cx="146.0" cy="129.0" r="1.5" fill="#1a5276"/>
  <circle cx="153.0" cy="129.0" r="1.5" fill="#1a5276"/>

  <text x="135" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Beute-Nachwuchs</text>

  <!-- a -->
  <rect x="270" y="50" width="230" height="160" rx="12" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="385" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#922b21">a</text>
  
  <ellipse cx="350" cy="125" rx="15.400000000000002" ry="8.8" fill="#5dade2" stroke="#1a5276" stroke-width="2"/>
  <circle cx="345.6" cy="123.9" r="1.6500000000000001" fill="#1a5276"/>
  <circle cx="353.3" cy="123.9" r="1.6500000000000001" fill="#1a5276"/>

  
  <ellipse cx="420" cy="125" rx="16.5" ry="10.5" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <polygon points="436.5,125 448.5,119.0 448.5,131.0" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <circle cx="417.0" cy="122.75" r="1.875" fill="#922b21"/>

  <text x="385" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Beute wird gefressen</text>

  <!-- b -->
  <rect x="520" y="50" width="230" height="160" rx="12" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="635" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6c3483">b</text>
  
  <ellipse cx="600" cy="115" rx="15.399999999999999" ry="9.799999999999999" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <polygon points="615.4,115 626.6,109.4 626.6,120.6" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <circle cx="597.2" cy="112.9" r="1.75" fill="#922b21"/>

  
  <ellipse cx="660" cy="135" rx="11.0" ry="7.0" fill="#f1948a" stroke="#922b21" stroke-width="2"/>
  <polygon points="671.0,135 679.0,131.0 679.0,139.0" fill="#f1948a" stroke="#922b21" stroke-width="2"/>
  <circle cx="658.0" cy="133.5" r="1.25" fill="#922b21"/>

  <text x="635" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Räuber-Nachwuchs</text>

  <!-- m -->
  <rect x="770" y="50" width="210" height="160" rx="12" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="2"/>
  <text x="875" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#566573">m</text>
  
  <ellipse cx="850" cy="120" rx="15.399999999999999" ry="9.799999999999999" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <polygon points="865.4,120 876.6,114.4 876.6,125.6" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <circle cx="847.2" cy="117.9" r="1.75" fill="#922b21"/>

  <line x1="830" y1="105" x2="870" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="870" y1="105" x2="830" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <text x="875" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Räuber stirbt</text>

  <!-- equation legend -->
  <rect x="20" y="240" width="960" height="150" rx="12" fill="#f8f9f9" stroke="#bdc3c7"/>
  <text x="500" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">In der Formel</text>
  <text x="500" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Beute:  + r N   minus   a N P     |     Räuber:  + b (a N P)   minus   m P</text>
  <text x="500" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Nachwuchs    gefressen              aus Fressen geboren         Sterberate</text>
</svg>
