  <text x="30" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a5276">2 · Über Generationen</text>
  <text x="30" y="170" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5d6d7e">zerschneidet Rekombination</text>
  <text x="30" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5d6d7e">sein Chromosom</text>
