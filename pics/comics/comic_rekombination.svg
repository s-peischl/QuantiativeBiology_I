  <text x="600.0" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7d6608">nahe Eda: Meer-Stücke werden von Selektion entfernt</text>
  <text x="600.0" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b2182b">weit weg: Meer-Stücke bleiben → Genfluss</text>
  <text x="30" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a5276">3 · Ergebnis</text>
