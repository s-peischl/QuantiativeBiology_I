  <text x="480" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a5276">Rekombination: warum Spitzen eine Breite haben</text>
  <text x="30" y="80" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a5276">1 · Ein Meerfisch</text>
  <text x="30" y="100" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5d6d7e">wandert in den See</text>
  <rect x="300" y="72" width="600" height="18" rx="9" fill="#2166ac"/>
