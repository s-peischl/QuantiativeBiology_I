  <text x="234" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Schritt 1 &#183; Selektion trennt</text>

  <rect x="62" y="120" width="160" height="150" rx="10" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="142" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">See</text>
  <text x="142" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">A ist hier besser</text>
  <circle cx="102" cy="207" r="13" fill="#2166ac"/>
  <circle cx="142" cy="207" r="13" fill="#2166ac"/>
  <circle cx="182" cy="207" r="13" fill="#b2182b"/>
  <text x="142" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">p1 steigt</text>

  <rect x="246" y="120" width="160" height="150" rx="10" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="326" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Meer</text>
  <text x="326" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">a ist hier besser</text>
  <circle cx="286" cy="207" r="13" fill="#b2182b"/>
  <circle cx="326" cy="207" r="13" fill="#b2182b"/>
  <circle cx="366" cy="207" r="13" fill="#2166ac"/>
  <text x="326" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">p2 faellt</text>

  <text x="234" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Abstand zwischen den Habitaten waechst</text>

  <text x="462" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7f8c8d">&gt;</text>

  <rect x="490" y="66" width="436" height="250" rx="12" fill="#fdf3e7" stroke="#e67e22" stroke-width="2"/>
  <text x="708" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#b9770e">Schritt 2 &#183; Migration mischt</text>

  <rect x="520" y="120" width="170" height="150" rx="10" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="605" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">See</text>
  <circle cx="565" cy="185" r="13" fill="#2166ac"/>
  <circle cx="605" cy="185" r="13" fill="#2166ac"/>
  <circle cx="645" cy="185" r="13" fill="#b2182b"/>
  <text x="605" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Anteil m kommt</text>
  <text x="605" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">von nebenan</text>

  <rect x="726" y="120" width="170" height="150" rx="10" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="811" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Meer</text>
  <circle cx="771" cy="185" r="13" fill="#b2182b"/>
  <circle cx="811" cy="185" r="13" fill="#b2182b"/>
  <circle cx="851" cy="185" r="13" fill="#2166ac"/>
  <text x="811" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Anteil m kommt</text>
  <text x="811" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">von nebenan</text>

  <path d="M 690 160 C 706 146, 710 146, 726 160" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="726,160 716,154 717,163" fill="#e67e22"/>
  <path d="M 726 210 C 710 224, 706 224, 690 210" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="690,210 700,204 699,213" fill="#e67e22"/>

  <text x="708" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Abstand zwischen den Habitaten schrumpft</text>

  <text x="480" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Bleibt ein Unterschied bestehen, halten sich die beiden Schritte die Waage</text>
  <text x="480" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">viel Migration bei schwacher Selektion: die Habitate werden genetisch gleich (gene swamping)</text>
</svg>
