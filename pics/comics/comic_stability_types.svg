<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#fbfcfd"/>
  <text x="490" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a5276">Was heisst stabil? (Raeuber-Beute-Blick)</text>

  <!-- Point -->
  <rect x="30" y="60" width="290" height="320" rx="14" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="175" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#196f3d">1. Punktgleichgewicht</text>
  <polyline points="60,300 90,220 120,250 150,200 180,215 210,205 240,208 270,206"
            fill="none" stroke="#2980b9" stroke-width="3"/>
  <polyline points="60,330 95,280 130,300 165,270 200,278 235,272 270,273"
            fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="270" cy="206" r="5" fill="#2980b9"/>
  <circle cx="270" cy="273" r="5" fill="#c0392b"/>
  <text x="175" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">N und P laufen auf feste Dichten zu</text>
  <text x="175" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#196f3d">stabiler Attraktor = ein Punkt</text>

  <!-- Cycles -->
  <rect x="345" y="60" width="290" height="320" rx="14" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="490" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">2. Zyklen</text>
  <polyline points="375,280 400,180 430,300 460,160 490,310 520,170 550,290 580,200"
            fill="none" stroke="#2980b9" stroke-width="3"/>
  <polyline points="390,300 420,220 450,320 480,200 510,330 540,210 575,300"
            fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="490" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">Dichten schwingen dauerhaft</text>
  <text x="490" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a5276">Attraktor = Orbit / Grenzzyklus</text>

  <!-- Permanence -->
  <rect x="660" y="60" width="290" height="320" rx="14" fill="#fef9e7" stroke="#d68910" stroke-width="2"/>
  <text x="805" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9a7b0a">3. Permanenz (+ Chaos)</text>
  <path d="M700,300 C720,140 740,320 760,180 C780,320 800,150 820,290 C840,160 860,310 880,220"
        fill="none" stroke="#7d3c98" stroke-width="2.5"/>
  <path d="M710,310 C730,200 750,330 770,210 C790,330 810,190 830,300 C850,200 870,320 890,250"
        fill="none" stroke="#d68910" stroke-width="2.5"/>
  <path d="M705,290 C725,250 745,300 765,240 C785,300 805,230 825,280 C845,230 865,290 885,260"
        fill="none" stroke="#1abc9c" stroke-width="2.5"/>
  <text x="805" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">kein Aussterben - aber kein ruhiger Punkt</text>
  <text x="805" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a7b0a">Hofbauer / Schreiber: Permanenz</text>
</svg>
