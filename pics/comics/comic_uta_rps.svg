<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fbfcfd"/>
  <text x="480" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a5276">Uta stansburiana - drei Maennchen-Strategien (RPS)</text>

  <!-- ORANGE -->
  <rect x="40" y="55" width="280" height="300" rx="14" fill="#fdebd0" stroke="#e67e22" stroke-width="3"/>
  <circle cx="100" cy="90" r="14" fill="#e67e22" stroke="#a04000" stroke-width="2"/>
  <text x="100" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">O</text>
  <g transform="translate(175,148) scale(0.95)">
    <!-- body + head silhouette -->
    <path d="M-48,6
             C-70,-2 -92,-10 -108,-14
             C-95,8 -70,16 -48,12
             C-30,28 -10,30 12,22
             C28,34 38,34 44,28
             C52,36 58,34 62,28
             C78,24 88,12 86,2
             C92,-2 94,-8 88,-12
             C78,-22 58,-20 44,-12
             C28,-22 8,-18 -8,-8
             C-22,-14 -36,-8 -48,6 Z"
          fill="#7e5109"/>
    <!-- throat / dewlap -->
    <ellipse cx="48" cy="18" rx="16" ry="11" fill="#e67e22"/>
    <ellipse cx="50" cy="18" rx="8" ry="5" fill="#d35400"/>
    <!-- eye -->
    <circle cx="72" cy="-4" r="3" fill="#1a252f"/>
    <circle cx="73" cy="-5" r="1" fill="#f8f9f9"/>
