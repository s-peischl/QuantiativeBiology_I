    <path d="M-14,16 L-8,38 L0,36 L-6,14 Z" fill="#6e4408"/>
  </g>
  <text x="180" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#a04000">Orange</text>
  <text x="180" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">aggressiv, grosses Revier</text>
  <text x="180" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a04000">schlaegt Blau</text>

  <!-- BLUE -->
  <rect x="340" y="55" width="280" height="300" rx="14" fill="#d6eaf8" stroke="#2980b9" stroke-width="3"/>
  <circle cx="400" cy="90" r="14" fill="#3498db" stroke="#1a5276" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">B</text>
  <g transform="translate(495,148) scale(0.95)">
    <path d="M-48,6
             C-70,-2 -92,-10 -108,-14
             C-95,8 -70,16 -48,12
             C-30,28 -10,30 12,22
             C28,34 38,34 44,28
             C52,36 58,34 62,28
             C78,24 88,12 86,2
