    <path d="M22,20 L28,40 L36,38 L28,18 Z" fill="#154360"/>
    <path d="M-28,14 L-42,36 L-34,38 L-20,16 Z" fill="#154360"/>
    <path d="M-14,16 L-8,38 L0,36 L-6,14 Z" fill="#154360"/>
