  <text x="480" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">bewacht kleines Revier</text>
  <text x="480" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a5276">schlaegt Gelb</text>

  <!-- YELLOW -->
  <rect x="640" y="55" width="280" height="300" rx="14" fill="#fcf3cf" stroke="#f1c40f" stroke-width="3"/>
  <circle cx="700" cy="90" r="14" fill="#f4d03f" stroke="#7d6608" stroke-width="2"/>
  <text x="700" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7d6608">G</text>
  <g transform="translate(775,148) scale(0.95)">
    <path d="M-48,6
             C-70,-2 -92,-10 -108,-14
             C-95,8 -70,16 -48,12
             C-30,28 -10,30 12,22
             C28,34 38,34 44,28
             C52,36 58,34 62,28
             C78,24 88,12 86,2
             C92,-2 94,-8 88,-12
             C78,-22 58,-20 44,-12
             C28,-22 8,-18 -8,-8
             C-22,-14 -36,-8 -48,6 Z"
          fill="#7d6608"/>
    <ellipse cx="48" cy="18" rx="16" ry="11" fill="#f4d03f"/>
    <ellipse cx="50" cy="18" rx="8" ry="5" fill="#b7950b"/>
    <circle cx="72" cy="-4" r="3" fill="#1a252f"/>
    <circle cx="73" cy="-5" r="1" fill="#f8f9f9"/>
    <path d="M8,18 L-2,38 L6,38 L14,20 Z" fill="#6e5606"/>
    <path d="M22,20 L28,40 L36,38 L28,18 Z" fill="#6e5606"/>
    <path d="M-28,14 L-42,36 L-34,38 L-20,16 Z" fill="#6e5606"/>
    <path d="M-14,16 L-8,38 L0,36 L-6,14 Z" fill="#6e5606"/>
  </g>
  <text x="780" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#7d6608">Gelb</text>
  <text x="780" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">Schleicher, kein Revier</text>
  <text x="780" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7d6608">schlaegt Orange</text>

  <!-- cycle chevrons -->
  <polygon points="330,200 318,190 318,210" fill="#7f8c8d"/>
  <polygon points="630,200 618,190 618,210" fill="#7f8c8d"/>

  <text x="480" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5d6d7e">Orange &gt; Blau &gt; Gelb &gt; Orange  -  zyklische Dominanz</text>
  <text x="480" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f8c8d">Sinervo &amp; Lively 1996; Corl et al. 2026 Science</text>
</svg>
