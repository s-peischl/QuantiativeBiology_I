    <ellipse cx="50" cy="18" rx="8" ry="5" fill="#1a5276"/>
    <circle cx="72" cy="-4" r="3" fill="#0b1c2c"/>
    <circle cx="73" cy="-5" r="1" fill="#f8f9f9"/>
