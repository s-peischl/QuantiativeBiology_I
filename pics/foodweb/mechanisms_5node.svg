<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
  <rect width="980" height="480" fill="#fbfcfd"/>
  <text x="490" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a5276">Interaktionen im 5-Knoten-Modell</text>
  <text x="490" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">V Weide · H Elch · P Wolf · C Kojote · B Biber</text>

  <!-- simplified interaction list as cards -->
  <rect x="40" y="80" width="280" height="150" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#196f3d">Auf Weide V</text>
  <text x="180" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">+ Wachstum (logistisch)</text>
  <text x="180" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">- Verbiss durch Elch</text>
  <text x="180" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">+ Foerderung durch Biber</text>

  <rect x="350" y="80" width="280" height="150" rx="12" fill="#fef9e7" stroke="#d68910" stroke-width="2"/>
  <text x="490" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#9a7b0a">Auf Elch H</text>
  <text x="490" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">+ Futter aus Weide</text>
  <text x="490" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">- Predation Wolf</text>
  <text x="490" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">- Predation Kojote (schwaecher)</text>

  <rect x="660" y="80" width="280" height="150" rx="12" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="800" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Praedatoren</text>
  <text x="800" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">P waechst mit Elch</text>
  <text x="800" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">C waechst mit Elch</text>
  <text x="800" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">P unterdrueckt C stark</text>

  <rect x="40" y="260" width="440" height="160" rx="12" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="260" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#148f77">Biber B</text>
  <text x="260" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">braucht Weide (hohe V)</text>
  <text x="260" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">foerdert Weide (Ingenieur)</text>
  <text x="260" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#148f77">ohne Wolf: V tief -&gt; B bricht ein</text>

  <rect x="500" y="260" width="440" height="160" rx="12" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="2"/>
  <text x="720" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#566573">Erwartung Mit/Ohne Wolf</text>
  <text x="720" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">ohne P: C hoch, V und B niedrig</text>
  <text x="720" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">mit P: C runter, V und B hoch</text>
  <text x="720" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a5276">Mesopraedator-Release + Kaskade</text>
</svg>
