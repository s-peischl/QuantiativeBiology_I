<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <rect width="960" height="340" fill="white"/>

  <rect x="40" y="50" width="400" height="240" rx="18" fill="#fdedec" stroke="#c0392b" stroke-width="3"/>
  <ellipse cx="200" cy="130" rx="90" ry="55" fill="white" stroke="#922b21" stroke-width="3"/>
  <polygon points="160,175 140,210 200,180" fill="white" stroke="#922b21" stroke-width="3"/>
  <line x1="250" y1="100" x2="290" y2="70" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="70" x2="290" y2="100" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <text x="240" y="250" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="bold" fill="#922b21">Daten sprechen nicht</text>
  <text x="240" y="275" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#333">kein Orakel</text>

  <rect x="520" y="50" width="400" height="240" rx="18" fill="#eafaf1" stroke="#27ae60" stroke-width="3"/>
  <circle cx="720" cy="130" r="50" fill="white" stroke="#196f3d" stroke-width="4"/>
  <text x="720" y="150" text-anchor="middle" font-family="Helvetica" font-size="56" font-weight="bold" fill="#196f3d">?</text>
  <text x="720" y="250" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="bold" fill="#196f3d">Sie antworten</text>
  <text x="720" y="275" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#333">auf unsere Fragen</text>

</svg>
