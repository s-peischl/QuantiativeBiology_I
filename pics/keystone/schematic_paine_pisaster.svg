<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400">
  <rect width="980" height="400" fill="#f7fafc"/>
  <text x="490" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a5276">Paine 1966 - Seestern-Entfernung (Keystone, qualitativ)</text>
  <text x="490" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Unterrichtsskizze nach dem klassischen Experiment</text>

  <rect x="40" y="80" width="420" height="250" rx="14" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#196f3d">mit Pisaster</text>
  <rect x="150" y="140" width="200" height="44" rx="8" fill="#c0392b"/>
  <text x="250" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="white">Seestern (Keystone)</text>
  <text x="250" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7f8c8d">v frisst Miesmuscheln</text>
  <rect x="100" y="230" width="100" height="40" rx="6" fill="#5dade2"/>
  <text x="150" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="white">Algen</text>
  <rect x="220" y="230" width="100" height="40" rx="6" fill="#1abc9c"/>
  <text x="270" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="white">Ranken</text>
  <rect x="340" y="230" width="100" height="40" rx="6" fill="#f5b041"/>
  <text x="390" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a252f">Muscheln</text>
  <text x="250" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#196f3d">Raum geteilt - hohe Vielfalt</text>

  <rect x="520" y="80" width="420" height="250" rx="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="730" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#922b21">ohne Pisaster</text>
  <text x="730" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#922b21">kein Top-Kontrolle</text>
  <rect x="580" y="185" width="300" height="70" rx="8" fill="#f5b041"/>
  <text x="730" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a252f">Mytilus dominiert</text>
  <text x="730" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a252f">Competitive Exclusion um Raum</text>
  <text x="730" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#922b21">weniger Platzhalter-Arten</text>

  <text x="490" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a5276">Praedator verhindert Exclusion - gleiche Idee wie Wolf/Aspen, anderes System</text>
</svg>
